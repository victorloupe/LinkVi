<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="https://lujsstahllhcrkfgjmcw.supabase.co/storage/v1/object/public/logos/favicon.ico">
<title>LinksVi — Carregando...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F172A;
    --navy-soft: #475569;
    --gold: #6366F1;
    --gold-deep: #7C3AED; /* This becomes the custom highlight color */
    --bg: #FFFFFF;
    --btn-bg: #FFFFFF; /* Custom button background */
    --btn-text: #0F172A; /* Custom button text color */
    --pill-bg: #EEF2FF; /* Light version of custom highlight color */
    --line: #E2E8F0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--navy);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Nav styling */
  nav {
    display: none; /* Shown after load */
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-wrap img {
    height: 100px; /* Enlarged logo */
    width: auto;
    display: block;
    object-fit: contain;
  }

  /* Main Container */
  main {
    display: none; /* Shown after load */
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 24px 40px;
    text-align: center;
    flex: 1 0 auto;
    width: 100%;
  }

  .pill {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 30px;
    background: var(--pill-bg);
    color: var(--gold-deep);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp .5s ease forwards .05s;
  }

  .brand-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.25;
    margin: 16px 0 8px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp .5s ease forwards .1s;
  }

  .brand-desc {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--navy-soft);
    margin: 0 0 24px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp .5s ease forwards .18s;
  }

  .cta-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.2;
    margin: 0 0 6px;
    color: var(--navy);
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp .5s ease forwards .24s;
  }

  p.sub {
    font-size: 13px;
    line-height: 1.5;
    color: var(--navy-soft);
    margin: 0 0 28px;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp .5s ease forwards .3s;
  }

  @keyframes fadeUp {
    0% {
      opacity: 0;
      transform: translateY(20px) scale(0.98);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .btn-icon {
    width: 22px;
    height: 22px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover .btn-icon { transform: scale(1.15); }
  .btn-icon svg { width: 100%; height: 100%; }

  .btn-label { flex: 1; text-align: left; }

  .btn-arrow { flex: none; transition: transform .25s cubic-bezier(0.4, 0, 0.2, 1); }
  .btn:hover .btn-arrow { transform: translateX(5px); }

  .btn-outline {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1.4px solid var(--line);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
  }
  .btn-outline .btn-icon { color: var(--gold-deep); }
  .btn-outline:hover {
    border-color: var(--gold-deep);
    background: var(--btn-bg);
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 8px 16px rgba(15, 23, 42, 0.04);
  }

  footer {
    display: none; /* Shown after load */
    text-align: center;
    padding: 24px 20px;
    font-size: 12px;
    color: var(--navy-soft);
    border-top: 1px solid var(--line);
    background: var(--bg);
    margin-top: auto;
    width: 100%;
  }
  .purple-vi {
    color: #7C3AED !important; /* Developed by LinksVi always has Vi in purple */
    font-weight: 750;
  }

  /* Custom modern scrollbars */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  .map-card {
    background: var(--btn-bg);
    border: 1.4px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    text-align: left;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .map-card-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--btn-text);
  }
  .map-iframe-wrapper {
    width: 100%;
    overflow: hidden;
    border-radius: 8px;
  }

  /* Loading Spinner */
  #loader-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.4s ease;
  }
  
  /* Custom scrollbar for premium look */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--navy-soft);
    border-radius: 4px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--navy);
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid var(--line);
    border-top-color: var(--gold-deep);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  #loader-container p {
    font-family: 'Inter', sans-serif;
    color: var(--navy-soft);
    font-size: 13.5px;
    font-weight: 500;
    margin: 0;
  }

  /* Error State Screen */
  #error-screen {
    display: none;
    max-width: 400px;
    margin: auto;
    padding: 32px 24px;
    text-align: center;
    font-family: 'Inter', sans-serif;
  }
  #error-screen h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    color: var(--navy);
    margin-bottom: 12px;
  }
  #error-screen p {
    color: var(--navy-soft);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .error-icon {
    font-size: 44px;
    color: var(--gold-deep);
    margin-bottom: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<!-- Loader Screen -->
<div id="loader-container">
  <div class="spinner"></div>
  <p>Carregando links...</p>
</div>

<!-- Error Screen -->
<div id="error-screen">
  <div class="error-icon">⚠️</div>
  <h1>Link não encontrado</h1>
  <p>Não encontramos a página solicitada. Verifique se o endereço foi digitado corretamente ou fale com o administrador.</p>
</div>

<!-- Header / Nav -->
<nav id="navbar">
  <div class="logo-wrap">
    <img id="store-logo" src="" alt="Logo" style="display: none;">
  </div>
</nav>

<!-- Content -->
<main id="main-content">
  <span class="pill" id="store-pill">Nossos Links</span>
  <h1 class="brand-title" id="store-title">Carregando...</h1>
  <p class="brand-desc" id="store-desc"></p>
  
  <h2 class="cta-title" id="store-cta">Onde você quer nos encontrar?</h2>
  <p class="sub" id="store-sub"></p>

  <div class="links" id="links-container">
    <!-- Rendered dynamically -->
  </div>
</main>

<footer id="footer">Desenvolvido por Links<span class="purple-vi">Vi</span></footer>

<!-- Supabase JS Client Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // SUPABASE CLIENT CONFIGURATION
  const supabaseUrl = "https://lujsstahllhcrkfgjmcw.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1anNzdGFobGxoY3JrZmdqbWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTk2NzMsImV4cCI6MjEwMDQ3NTY3M30.Hz5792fPykt248SHcQBhxKb0yxfZsBLxXUKvXNKuppc";
  const supabaseClient = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

  // Synchronous theme cache loader to prevent white flashes on dark mode pages
  (function() {
    const urlParams = new URLSearchParams(window.location.search);
    let storeName = urlParams.get('store') || urlParams.get('loja');
    if (!storeName) {
      const path = window.location.pathname.replace(/^\/|\/$/g, '');
      if (path && path !== 'cliente' && path !== 'cliente.html' && path !== 'index' && path !== 'index.html') {
        storeName = path;
      }
    }
    if (storeName) {
      const cachedBg = localStorage.getItem('last_bg_' + storeName);
      const cachedText = localStorage.getItem('last_text_' + storeName);
      const cachedHighlight = localStorage.getItem('last_highlight_' + storeName);
      const cachedBtnBg = localStorage.getItem('last_btn_bg_' + storeName);
      const cachedBtnText = localStorage.getItem('last_btn_text_' + storeName);

      if (cachedBg) document.documentElement.style.setProperty('--bg', cachedBg);
      if (cachedText) {
        document.documentElement.style.setProperty('--navy', cachedText);
        if (cachedText.startsWith("#") && cachedText.length === 7) {
          document.documentElement.style.setProperty('--navy-soft', cachedText + "b3");
        } else {
          document.documentElement.style.setProperty('--navy-soft', cachedText);
        }
      }
      if (cachedHighlight) {
        document.documentElement.style.setProperty('--gold-deep', cachedHighlight);
        if (cachedHighlight.startsWith("#") && cachedHighlight.length === 7) {
          document.documentElement.style.setProperty('--pill-bg', cachedHighlight + "12");
        }
      }
      if (cachedBtnBg) document.documentElement.style.setProperty('--btn-bg', cachedBtnBg);
      if (cachedBtnText) document.documentElement.style.setProperty('--btn-text', cachedBtnText);
    }
  })();

  const LINK_ICONS = {
    instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/></svg>`,
    tiktok: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3v10.5a3.5 3.5 0 1 1-3-3.46V3z"/><path d="M14 6.4c1.4 1.6 3 2.2 5 2.2V5c-2 0-3.6-.7-5-1.8"/></svg>`,
    shopee: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>`,
    whatsapp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
    mapa: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
    comida: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 2v4M12 2v4M20 2v4M16 6a4 4 0 0 1-8 0V2M12 10v12M20 2v10M20 12h-4M20 12v10"/></svg>`,
    ifood: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M18 18h-6v-5h3l2-3V7M6 18h6M12 13V8H8M3 8h5"/></svg>`,
    coleta: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line><path d="M12 8V2M12 2l-3 3M12 2l3 3"/></svg>`,
    descarga: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line><path d="M12 2v6M12 8l-3-3M12 8l3-3"/></svg>`,
    retirada: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line><path d="M9 17l2 2 4-4"/></svg>`,
    web: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>`,
    fallback: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`
  };

  function getLinkIconHTML(imageKeyOrUrl, label = "") {
    if (!imageKeyOrUrl) {
      return LINK_ICONS.fallback;
    }
    if (imageKeyOrUrl.startsWith("http://") || imageKeyOrUrl.startsWith("https://") || imageKeyOrUrl.startsWith("data:")) {
      return `<img src="${imageKeyOrUrl}" alt="${label}" style="width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 4px;">`;
    }
    if (imageKeyOrUrl.startsWith("<svg")) {
      return imageKeyOrUrl;
    }
    if (LINK_ICONS[imageKeyOrUrl]) {
      return LINK_ICONS[imageKeyOrUrl];
    }
    return LINK_ICONS.fallback;
  }

  // Parse store name from URL query parameter or path
  function getStoreName() {
    const urlParams = new URLSearchParams(window.location.search);
    let storeName = urlParams.get('store') || urlParams.get('loja');
    
    if (!storeName) {
      // Fallback to pathname (e.g. /eprajapa -> eprajapa)
      const path = window.location.pathname.replace(/^\/|\/$/g, '');
      if (path && path !== 'cliente' && path !== 'cliente.html' && path !== 'index' && path !== 'index.html') {
        storeName = path;
      }
    }
    return storeName;
  }

  function showNotFound() {
    document.getElementById('loader-container').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loader-container').style.display = 'none';
      document.getElementById('error-screen').style.display = 'block';
    }, 400);
  }

  function showApp() {
    document.getElementById('loader-container').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loader-container').style.display = 'none';
      document.getElementById('navbar').style.display = 'flex';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('footer').style.display = 'block';
    }, 400);
  }

  async function loadStoreData() {
    const storeName = getStoreName();
    if (!storeName) {
      showNotFound();
      return;
    }

    if (!supabaseClient) {
      showNotFound();
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from("stores")
        .select("*")
        .eq("id", storeName)
        .single();
      
      if (error) {
        throw error;
      }
      
      if (data && data.config) {
        let config = data.config;
        if (typeof config === 'string') {
          try {
            config = JSON.parse(config);
          } catch (e) {
            console.error("Failed to parse config string", e);
          }
        }

        if (config) {
          // Apply custom theme color if present
          if (config.themeColor) {
            const themeColor = config.themeColor;
            document.documentElement.style.setProperty('--gold-deep', themeColor);
            
            // Generate a very soft alpha/translucent version for the pill background
            if (themeColor.startsWith("#") && themeColor.length === 7) {
              const pillBg = themeColor + "12"; // ~7% opacity hex representation
              document.documentElement.style.setProperty('--pill-bg', pillBg);
            }
          }

          if (config.textColor) {
            const textColor = config.textColor;
            document.documentElement.style.setProperty('--navy', textColor);
            if (textColor.startsWith("#") && textColor.length === 7) {
              document.documentElement.style.setProperty('--navy-soft', textColor + "b3"); // ~70% opacity
            } else {
              document.documentElement.style.setProperty('--navy-soft', textColor);
            }
          }

          if (config.bgColor) {
            document.documentElement.style.setProperty('--bg', config.bgColor);
          }

          if (config.btnColor) {
            document.documentElement.style.setProperty('--btn-bg', config.btnColor);
          }

          if (config.btnTextColor) {
            document.documentElement.style.setProperty('--btn-text', config.btnTextColor);
          }

          // Cache theme configuration locally to prevent flashes on next load
          localStorage.setItem('last_bg_' + storeName, config.bgColor || "#ffffff");
          localStorage.setItem('last_text_' + storeName, config.textColor || "#0f172a");
          localStorage.setItem('last_highlight_' + storeName, config.themeColor || "#7c3aed");
          localStorage.setItem('last_btn_bg_' + storeName, config.btnColor || "#ffffff");
          localStorage.setItem('last_btn_text_' + storeName, config.btnTextColor || "#0f172a");

          // 1. Logo
          const logoImg = document.getElementById('store-logo');
          
          // Set logo height dynamically based on size config
          const logoSize = config.logoSize || "medium";
          if (logoSize === 'small') {
            logoImg.style.height = '70px';
          } else if (logoSize === 'large') {
            logoImg.style.height = '130px';
          } else {
            logoImg.style.height = '100px'; // medium (default)
          }

          if (config.logoUrl) {
            logoImg.src = config.logoUrl;
            logoImg.alt = config.title || storeName;
            logoImg.style.display = 'block';
          } else {
            logoImg.src = "https://lujsstahllhcrkfgjmcw.supabase.co/storage/v1/object/public/logos/logo.png";
            logoImg.alt = "LinksVi";
            logoImg.style.display = 'block';
          }

          // 2. Document Title
          document.title = config.title ? `${config.title} — Links` : `${storeName} — Links`;

          // 3. Pill
          const pillSpan = document.getElementById('store-pill');
          if (config.pillText) {
            pillSpan.textContent = config.pillText;
            pillSpan.style.display = 'inline-block';
          } else {
            pillSpan.style.display = 'none';
          }

          // 4. Main Title
          const titleH1 = document.getElementById('store-title');
          if (config.title) {
            titleH1.innerHTML = config.title.replace(/\n/g, '<br>');
            titleH1.style.display = 'block';
          } else {
            titleH1.style.display = 'none';
          }

          // 5. Description
          const descP = document.getElementById('store-desc');
          if (config.description) {
            descP.textContent = config.description;
            descP.style.display = 'block';
          } else {
            descP.style.display = 'none';
          }

          // 6. CTA Title
          const ctaH2 = document.getElementById('store-cta');
          if (config.ctaTitle) {
            ctaH2.textContent = config.ctaTitle;
            ctaH2.style.display = 'block';
          } else {
            ctaH2.style.display = 'none';
          }

          // 7. Sub CTA Text
          const subP = document.getElementById('store-sub');
          if (config.subText) {
            subP.innerHTML = config.subText.replace(/\n/g, '<br>');
            subP.style.display = 'block';
          } else {
            subP.style.display = 'none';
          }

          // 8. Render Links
          if (config.links && Array.isArray(config.links)) {
            renderLinks(config.links);
          }
          
          showApp();
        } else {
          showNotFound();
        }
      } else {
        showNotFound();
      }
    } catch (err) {
      console.error("Erro ao carregar dados do Supabase:", err);
      showNotFound();
    }
  }

  function renderLinks(links) {
    const container = document.getElementById('links-container');
    if (!container || !links || links.length === 0) return;
    
    container.innerHTML = '';
    links.forEach((link, index) => {
      // Check if this is an embedded map iframe
      const isMap = link.image === 'mapa';
      const isIframe = link.url.includes('<iframe') || link.url.includes('google.com/maps/embed');
      
      if (isMap && isIframe) {
        let srcUrl = link.url;
        if (link.url.includes('<iframe')) {
          const match = link.url.match(/src=["']([^"']+)["']/);
          if (match && match[1]) {
            srcUrl = match[1];
          }
        }
        
        const card = document.createElement('div');
        card.className = 'map-card';
        card.style.animationDelay = `${0.38 + index * 0.08}s`;
        
        card.innerHTML = `
          <div class="map-card-title">${link.label}</div>
          <div class="map-iframe-wrapper">
            <iframe src="${srcUrl}" width="100%" height="220" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        `;
        container.appendChild(card);
        return;
      }
      
      const a = document.createElement('a');
      a.className = 'btn btn-outline';
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.animationDelay = `${0.38 + index * 0.08}s`;
      
      const iconSpan = document.createElement('span');
      iconSpan.className = 'btn-icon';
      iconSpan.innerHTML = getLinkIconHTML(link.image, link.label);
      
      const labelSpan = document.createElement('span');
      labelSpan.className = 'btn-label';
      labelSpan.textContent = link.label;
      
      const arrowSpan = document.createElement('span');
      arrowSpan.className = 'btn-arrow';
      arrowSpan.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
      
      a.appendChild(iconSpan);
      a.appendChild(labelSpan);
      a.appendChild(arrowSpan);
      
      container.appendChild(a);
    });
  }

  document.addEventListener('DOMContentLoaded', loadStoreData);
</script>

</body>
</html>
